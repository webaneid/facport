# docker-compose.dev.yml
# HANYA untuk development lokal — Postgres & MinIO saja. apps/api dan
# apps/web dijalankan LANGSUNG via `bun run dev` (bukan di container),
# supaya hot-reload cepat tanpa rebuild image tiap ubah kode.
# Jalan: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbname_dev
    ports:
      - "5432:5432" # expose ke host, BEDA dari prod yang sengaja tidak expose — ini cuma dev lokal
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console — buka http://localhost:9001 buat lihat file yang di-upload pas dev
    volumes:
      - minio_data_dev:/data

volumes:
  postgres_data_dev:
  minio_data_dev:
