name: CI

# Jalan di TIAP pull request ke main — beda dari release.yml yang cuma
# jalan setelah masuk main. Tujuannya: masalah ketahuan SEBELUM merge,
# bukan sesudah.
on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    # § test route (app.test.ts dst) beneran nulis/baca Postgres nyata
    # (bukan mock) — WAJIB service container ini, bukan cuma env var kosong.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facport_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # § Nilai DUMMY khusus CI (Postgres service di atas fresh tiap run,
      # tidak pernah persist) — BUKAN secret production sungguhan, aman
      # ditulis langsung di sini (bukan lewat repo Secrets), § architecture-security.md.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/facport_ci
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_URL: http://localhost:9000
      PORT: "3001"
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-only-32chars
      BETTER_AUTH_URL: http://localhost:3001
      COOKIE_DOMAIN: localhost
      ACCURATE_REDIRECT_URI: http://localhost:3001/accurate/oauth/callback
      ACCURATE_TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-not-for-production-32chars
    steps:
      # § fetch-depth: 0 (bukan default shallow 1) — gitleaks-action di bawah
      # butuh bandingkan base..head commit PR, gagal "unknown revision" kalau
      # histori git-nya cuma 1 commit. Baru ketahuan di PR pertama repo ini.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Migrate test database
        run: bun run db:migrate

      - name: Seed database (role admin/customer, dst)
        run: bun run --cwd apps/api db:seed

      - name: Test
        run: bun run test

      - name: Secret scan (lapis kedua, independen dari hook Claude Code)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        run: bun audit
        continue-on-error: true   # warning, tidak block PR (bisa noisy)
