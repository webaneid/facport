name: Deploy

# Trigger OTOMATIS setelah run release.yml di branch main SELESAI (bukan
# lewat event "release: published" — GitHub Actions SENGAJA tidak memicu
# workflow lain untuk event yang dibuat oleh GITHUB_TOKEN bawaan, dan
# semantic-release di release.yml pakai GITHUB_TOKEN itu buat bikin GitHub
# Release. Ditemukan 2026-08-26: deploy.yml TIDAK PERNAH jalan untuk
# v1.0.0/v1.0.1/v1.0.2 walau release.yml sukses tiap kali — nol image
# pernah ke-build/push ke GHCR. Detail → docs/lessons-learned.md.
# workflow_run di bawah dipicu oleh SELESAINYA run release.yml itu sendiri
# (event dari platform, bukan dari token di dalam run itu), jadi tidak
# kena batasan yang sama.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Trigger manual — isi tag image yang mau dibangun (mis. v1.0.2)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  resolve-tag:
    # workflow_run jalan walau release.yml GAGAL — cuma lanjut kalau sukses
    # (atau trigger manual).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # WAJIB checkout tip TERBARU "main", BUKAN
          # github.event.workflow_run.head_sha — semantic-release nambah
          # commit "chore(release): x.x.x" (berisi tag) SETELAH commit yang
          # men-trigger run ini, jadi head_sha SELALU beda dari commit yang
          # ditag. Ditemukan 2026-08-26: bikin should_deploy selalu false,
          # build-and-push ke-skip terus — lihat docs/lessons-learned.md.
          ref: main

      - name: Resolve tag & pastikan release baru beneran dibuat
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tip "main" SAAT INI persis di sebuah tag? Kalau ya, berarti
          # semantic-release baru saja bikin release baru buat run ini.
          # Kalau push sebelumnya cuma "docs:"/"chore:" (tidak ada release
          # baru), tip main TIDAK bertambah komit "chore(release)" apa pun
          # dan describe --exact-match bakal gagal (skip, correct).
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push image API — cuma isi dari Dockerfile (hasil build),
      # bukan source repo mentah. Tag pakai nomor versi dari release,
      # bukan "latest" doang, biar tiap versi tetap bisa ditelusuri/rollback.
      - name: Build & push apps/api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ needs.resolve-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/api:latest

      # § Fase 103 (2026-09-11) — inject tag versi (mis. "v1.27.2") sebagai
      # env var runtime `APP_VERSION`, dibaca Server Component layout untuk
      # footer copyright (§ apps/web/components/app-shell/footer.tsx).
      # SENGAJA bukan NEXT_PUBLIC_* — tidak perlu baked ke client bundle,
      # cukup dibaca process.env di request-time SSR seperti settings lain.
      - name: Build & push apps/web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.resolve-tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ needs.resolve-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/web:latest

  deploy-to-server:
    needs: [resolve-tag, build-and-push]
    runs-on: ubuntu-latest
    steps:
      # TEMPLATE — sesuaikan dengan cara akses server kamu yang sebenarnya.
      # Pola umum: SSH ke server, pull image baru dari registry, restart
      # container. Server TIDAK PERNAH clone git repo — cuma pull image
      # yang sudah jadi, jadi otomatis nggak ada docs/.md di server.
      # Kalau secrets SERVER_HOST/SERVER_USER/SERVER_SSH_KEY belum diisi
      # (belum setup auto-deploy), step ini gagal — TIDAK apa-apa, image
      # di job sebelumnya tetap sudah ter-push ke GHCR.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # § ditemukan re-audit 2026-09-12 — script ini TIDAK PERNAH
          # dijalankan sungguhan (secrets kosong, job ini selalu gagal di
          # step login/exec, § catatan "TEMPLATE" di atas), tapi kalau
          # secrets ini nanti diisi, script akan langsung aktif APA
          # ADANYA tanpa direview ulang. Sebelum fix ini, script direproduksi
          # PERSIS 2 bug yang sudah didokumentasikan gagal di production
          # (lihat docs/lessons-learned.md 2026-08-28/2026-08-31 &
          # 2026-09-12): (1) `up -d` TANPA `-f docker-compose.override.yml`
          # DAN tanpa daftar service eksplisit → container naik tanpa port
          # mapping ke nginx (502 diam-diam), (2) tidak ada langkah
          # `db:migrate` sama sekali. Disamakan sekarang dengan runbook
          # manual "Full" di architecture-deployment.md yang SUDAH
          # diverifikasi jalan benar — kalau runbook manual itu berubah,
          # samakan lagi di sini.
          script: |
            cd /opt/app   # sesuaikan path deploy di VPS Hostinger kamu
            export GITHUB_REPO="${{ github.repository }}"
            export IMAGE_TAG="${{ needs.resolve-tag.outputs.tag }}"
            echo "GITHUB_REPO=$GITHUB_REPO" > .env.deploy
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env.deploy
            docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.deploy pull
            docker compose -f docker-compose.prod.yml -f docker-compose.override.yml --env-file .env.production --env-file .env.deploy up -d api web worker minio postgres
            docker compose -f docker-compose.prod.yml -f docker-compose.override.yml --env-file .env.production --env-file .env.deploy exec api bun run db:migrate
            docker image prune -f   # bersihin image versi lama biar disk VPS nggak penuh
