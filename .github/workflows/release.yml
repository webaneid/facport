name: Release

# Jalan tiap push ke main. semantic-release yang MENENTUKAN apakah perlu
# release baru atau tidak (kalau commit sejak tag terakhir cuma "chore:"/"docs:",
# nggak ada release baru dibuat sama sekali — bukan setiap push jadi angka baru).
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # § pola sama ci.yml — test route butuh Postgres nyata, bukan mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facport_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # § nilai DUMMY khusus CI, sama seperti ci.yml — lihat catatan di sana.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/facport_ci
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_URL: http://localhost:9000
      PORT: "3001"
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-only-32chars
      BETTER_AUTH_URL: http://localhost:3001
      COOKIE_DOMAIN: localhost
      ACCURATE_REDIRECT_URI: http://localhost:3001/accurate/oauth/callback
      ACCURATE_TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-not-for-production-32chars
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu full history biar semantic-release bisa baca semua commit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # § pola sama ci.yml — test upload bukti transfer butuh MinIO nyata,
      # docker run manual (bukan services:) karena image resmi minio
      # wajib command "server /data" yang tidak bisa diset lewat services:.
      # Pakai quay.io (bukan docker.io) — § ci.yml, hindari rate-limit
      # anonymous pull docker.io di shared runner.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "::error::MinIO tidak siap setelah 30 detik" && exit 1

      - name: Install dependencies
        run: bun install

      - name: Type check (gate — release dibatalkan kalau gagal)
        run: bun run typecheck

      - name: Migrate test database
        run: bun run db:migrate

      - name: Seed database (role admin/customer, dst)
        run: bun run --cwd apps/api db:seed

      - name: Run tests (gate — release dibatalkan kalau gagal)
        run: bun run test

      - name: Secret scan (lapis kedua, jaga-jaga bypass PR/ci.yml)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
        # Output dari step ini: kalau ada release baru → git tag dibuat,
        # CHANGELOG.md diupdate, GitHub Release dibuat otomatis dengan
        # catatan rilis dari commit message. Ini trigger workflow deploy.yml
        # lewat event "release: published".
