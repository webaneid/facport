name: Deploy Staging

# Trigger tiap push ke "develop" — TIDAK lewat semantic-release/versioning
# (beda dari release.yml/deploy.yml yang trigger dari GitHub Release event
# di "main"). Staging itu preview terus-menerus, bukan artifact ber-versi.
# Lihat docs/decisions/adr-0003-staging-environment.md.
on:
  push:
    branches: [develop]

# § ketemu 2026-09-04 — tanpa ini, GITHUB_TOKEN default read-only untuk
# packages (kebijakan org), push image ke GHCR gagal "denied: installation
# not allowed to Write organization package". deploy.yml SUDAH benar
# (block ini sudah ada di sana), deploy-staging.yml belum — baru ketahuan
# sekarang karena trigger push:develop belum pernah jalan sebelumnya.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # § ketemu 2026-09-04, PR pertama yang bikin branch `develop` — job ini
    # copy pola typecheck+test dari ci.yml TAPI lupa ikut copy services
    # Postgres + env block-nya, jadi `bun run test` selalu gagal "Environment
    # variable tidak valid" begitu benar-benar dijalankan (baru ketahuan
    # sekarang karena trigger push ke `develop` belum pernah jalan
    # sebelumnya — lihat docs/lessons-learned.md). Blok di bawah SAMA
    # PERSIS dengan ci.yml/release.yml — kalau field env.ts nambah, update
    # KETIGANYA sekaligus.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: facport_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/facport_ci
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_URL: http://localhost:9000
      PORT: "3001"
      BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production-use-only-32chars
      BETTER_AUTH_URL: http://localhost:3001
      COOKIE_DOMAIN: localhost
      ACCURATE_REDIRECT_URI: http://localhost:3001/accurate/oauth/callback
      ACCURATE_TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-not-for-production-32chars
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (gate — deploy staging dibatalkan kalau gagal)
        run: bun run typecheck

      - name: Migrate test database
        run: bun run db:migrate

      - name: Seed database (role admin/customer, dst)
        run: bun run --cwd apps/api db:seed

      - name: Test (gate)
        run: bun run test

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag "staging" DITIMPA tiap push (bukan versioned) — sengaja, ini
      # cuma preview terkini dari branch develop, bukan artifact yang perlu
      # ditelusuri per-versi seperti production.
      - name: Build & push apps/api (staging)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:staging

      - name: Build & push apps/web (staging)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:staging

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/app   # SAMA dengan production — beda project name (-p), lihat docker-compose.staging.yml
            export GITHUB_REPO="${{ github.repository }}"
            echo "GITHUB_REPO=$GITHUB_REPO" > .env.deploy-staging
            docker network create edge 2>/dev/null || true   # no-op kalau sudah ada
            docker compose -f docker-compose.staging.yml -p app-staging \
              --env-file .env.staging --env-file .env.deploy-staging pull
            docker compose -f docker-compose.staging.yml -p app-staging \
              --env-file .env.staging --env-file .env.deploy-staging up -d
            docker image prune -f
